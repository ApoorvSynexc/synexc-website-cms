<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synexc CMS</title>
    <script>
      // Apply persisted theme + palette before React mounts to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem('synexc-theme');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
          var palette = localStorage.getItem('synexc-palette');
          if (palette && palette !== 'indigo') {
            document.documentElement.setAttribute('data-palette', palette);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
